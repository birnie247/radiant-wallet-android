ext {
    // BigInt (used for photon amounts and tx values) requires a modern WebView.
    // API 26 was the old floor; 28 is the current one because API 26-27 devices
    // ship a WebView that can be old enough to lack BigInt, which turns into the
    // "failed to start" screen rather than a working wallet. Android 9 also means
    // USE_BIOMETRIC alone is enough (no framework FingerprintManager fallback).
    minSdkVersion = 28
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    androidxBiometricVersion = '1.1.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}